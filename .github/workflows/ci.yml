name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Check migrations match the schema
        run: |
          pnpm --filter @rudd/db exec drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::packages/db/schema.ts has changes without a migration. Run: pnpm --filter @rudd/db generate"
            git status --porcelain packages/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      - run: pnpm build
