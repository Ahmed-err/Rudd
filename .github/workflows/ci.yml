name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rudd_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Apply migrations to a fresh database
        run: pnpm --filter @rudd/db migrate
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rudd_test
      - run: pnpm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/rudd_test
      - name: Check migrations match the schema
        run: |
          pnpm --filter @rudd/db exec drizzle-kit generate --name ci_check
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::packages/db/schema.ts has changes without a migration. Run: pnpm --filter @rudd/db generate"
            git status --porcelain packages/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      - run: pnpm build
